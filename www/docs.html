<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar — Documentation</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap');

:root {
    --bg:      #080808;
    --surface: #0f0f0f;
    --text:    #e8e8e8;
    --muted:   #555;
    --dim:     #1a1a1a;
    --accent:  #c8c8c8;
    --accent2: #888;
    --border:  rgba(255,255,255,0.06);
    --mono:    'IBM Plex Mono', monospace;
    --sans:    'DM Sans', sans-serif;
    --sidebar: 260px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
}

/* ── SIDEBAR ── */
.sidebar {
    width: var(--sidebar);
    min-height: 100vh;
    position: fixed;
    top: 0; left: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 50;
}

.sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
}

.sidebar-brand {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}

.sidebar-brand::before {
    content: '▸';
    color: var(--accent);
}

.sidebar-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 20px 24px 8px;
}

.sidebar a {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 8px 24px;
    border-left: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.sidebar a:hover {
    color: var(--text);
    background: rgba(255,255,255,0.03);
    border-left-color: var(--dim);
}

.sidebar a.active {
    color: var(--accent);
    border-left-color: var(--text);
    background: rgba(255,255,255,0.03);
}

/* ── TOPBAR ── */
.topbar {
    position: fixed;
    top: 0;
    left: var(--sidebar);
    right: 0;
    height: 56px;
    background: rgba(8,10,13,0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    z-index: 40;
}

.topbar a {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
}

.topbar a:hover { color: var(--accent); }

.topbar-right {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
}

/* ── CONTENT ── */
.content {
    margin-left: var(--sidebar);
    padding: 96px 64px 100px;
    max-width: calc(var(--sidebar) + 800px);
    width: 100%;
    min-height: 100vh;
}

/* ── MARKDOWN STYLES ── */
#markdown-content h1 {
    font-family: var(--sans);
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 24px;
    margin-top: 0;
    color: var(--text);
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

#markdown-content h2 {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-top: 64px;
    margin-bottom: 20px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
}

#markdown-content h2::before {
    content: '##';
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    font-weight: 400;
}

#markdown-content h3 {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 36px;
    margin-bottom: 14px;
    color: var(--muted);
}

#markdown-content p {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.85;
    color: var(--muted);
    margin-bottom: 18px;
}

#markdown-content ul, #markdown-content ol {
    margin-left: 20px;
    margin-bottom: 20px;
}

#markdown-content li {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    color: var(--muted);
    margin-bottom: 4px;
}

#markdown-content a {
    color: var(--accent);
    text-decoration: none;
}

#markdown-content a:hover {
    text-decoration: underline;
}

#markdown-content code {
    font-family: var(--mono);
    font-size: 12px;
    background: rgba(255,255,255,0.05);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.07);
}

#markdown-content pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--dim);
    border-radius: 6px;
    padding: 24px;
    overflow-x: auto;
    margin-bottom: 28px;
    margin-top: 8px;
}

#markdown-content pre code {
    background: none;
    border: none;
    padding: 0;
    color: #cdd6f4;
    font-size: 12.5px;
    line-height: 1.7;
}

#markdown-content blockquote {
    border-left: 3px solid var(--muted);
    padding: 14px 20px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.02);
    border-radius: 0 6px 6px 0;
}

#markdown-content blockquote p {
    color: var(--text);
    margin: 0;
}

#markdown-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 48px 0;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
    .sidebar { display: none; }
    .content { margin-left: 0; padding: 80px 24px 80px; }
    .topbar { left: 0; padding: 0 24px; }
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <a href="index.html" class="sidebar-brand">stellar</a>
    </div>
    <div class="sidebar-label">Reference</div>
    <div id="toc"></div>
</div>

<div class="topbar">
    <a href="index.html">← Home</a>
    <span class="topbar-right">v1.1.0</span>
</div>

<div class="content">
    <div id="markdown-content">Loading...</div>
</div>

<script>
async function loadDocs() {
    const res = await fetch("stellar.md");
    const md = await res.text();
    document.getElementById("markdown-content").innerHTML = marked.parse(md);
    buildTOC();
    highlightActive();
}

function buildTOC() {
    const toc = document.getElementById("toc");
    const headings = document.querySelectorAll("#markdown-content h2");
    headings.forEach((h, i) => {
        const id = "s" + i;
        h.id = id;
        const a = document.createElement("a");
        a.href = "#" + id;
        a.textContent = h.textContent.replace(/^##\s*/, '');
        toc.appendChild(a);
    });
}

function highlightActive() {
    const links = document.querySelectorAll(".sidebar a[href^='#']");
    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                links.forEach(l => l.classList.remove("active"));
                const active = document.querySelector(`.sidebar a[href="#${e.target.id}"]`);
                if (active) active.classList.add("active");
            }
        });
    }, { threshold: 0.5 });
    document.querySelectorAll("#markdown-content h2").forEach(h => observer.observe(h));
}

loadDocs();
</script>
</body>
</html>
